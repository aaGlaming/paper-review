# P24 container skeleton only; this file is not a verified deployment configuration.
services:
  # UNVERIFIED: 未在任何机器上启动过
  frontend:
    x-verification: "UNVERIFIED: 未在任何机器上启动过"
    x-note: "当前 frontend/ 没有 Dockerfile，本服务不可构建"

  # UNVERIFIED: 未在任何机器上启动过
  backend:
    x-verification: "UNVERIFIED: 未在任何机器上启动过"
    build: ./backend
    ports:
      - "8077:8077"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:?需要设置}
      LLM_API_KEY: ${LLM_API_KEY:?需要设置}
      LLM_MODEL: ${LLM_MODEL:?需要设置}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:?需要设置}
      MYSQL_DSN: ${MYSQL_DSN:?需要设置}
    volumes:
      - ./chroma_data:/app/chroma_data:ro
      - ./logs:/app/logs
    depends_on:
      - mysql

  # UNVERIFIED: 未在任何机器上启动过
  mysql:
    x-verification: "UNVERIFIED: 未在任何机器上启动过"
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?需要设置}
    volumes:
      - ./.compose/mysql:/var/lib/mysql

  # UNVERIFIED: 未在任何机器上启动过
  chroma:
    x-verification: "UNVERIFIED: 未在任何机器上启动过"
    # Tag matches the Python dependency pin; registry availability was not verified locally.
    image: chromadb/chroma:1.5.9
    ports:
      - "8000:8000"
