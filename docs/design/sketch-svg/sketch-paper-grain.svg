<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" fill="none" aria-hidden="true" width="300" height="300">
  <!-- 纸张颗粒：feTurbulence 生成细噪点，作为极淡的纸纹叠在底色上。
       用法：CSS 里 background-image: url(#) + opacity ≤ 0.035，不要直接看见颗粒。 -->
  <filter id="pr-paper-grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch" result="noise"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="300" height="300" filter="url(#pr-paper-grain)" opacity="0.5"/>
</svg>
